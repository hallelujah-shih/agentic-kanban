name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - name: 装依赖（pypi 轨：export 锁 + venv + pip install）
        # 镜像源双轨：办公网轨 uv sync --frozen 钉死锁内 aliyun URL，海外 CI 不可用；
        # 此处从锁导出纯钉版 requirements（含 sha256 哈希、零 URL），跨源装 pypi。
        # CI 上 .venv 是唯一 venv，无需 VIRTUAL_ENV 定向。
        # 禁 uv sync / uv run：默认按 aliyun 锁 sync，会装错源/破坏 CI venv。
        run: |
          uv export --locked --all-groups -o requirements-ci.txt
          uv venv
          UV_INDEX_URL=https://pypi.org/simple/ uv pip install -r requirements-ci.txt
      - name: 壳 node --check（前端壳解析防线）
        # findall 而非 search：防多块吞并；断言每壳至少 1 块，逐个 node --check。
        run: |
          OUT=/tmp
          .venv/bin/python - "$OUT" <<'PY'
          import re, sys
          out = sys.argv[1]
          from agent_kanban.api.web import board_shell, detail_shell
          for name, html in (("board", board_shell()), ("detail", detail_shell())):
              blocks = re.findall(r"<script>(.*?)</script>", html, re.S)
              assert blocks, name + ": no <script> block"
              for i, js in enumerate(blocks):
                  with open(out + "/ak-" + name + "-" + str(i) + ".js", "w") as fh:
                      fh.write(js)
          PY
          for f in "$OUT"/ak-board-*.js "$OUT"/ak-detail-*.js; do node --check "$f"; done
      - name: 全量套件（run_ac）
        # 禁 uv run（会按 aliyun 锁 sync）；-u 关块缓冲实时见逐条。
        run: .venv/bin/python -u tests/run_ac.py

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: docker build（pypi 轨）
        # Dockerfile 双轨 ARG：UV_DEPS_MODE=pip 走 export+pip 轨，UV_PIP_INDEX 钉 pypi。
        run: docker build --build-arg UV_DEPS_MODE=pip --build-arg UV_PIP_INDEX=https://pypi.org/simple/ -t agentic-kanban:ci .
