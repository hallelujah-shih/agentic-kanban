[project]
name = "agent-kanban"
version = "0.1.0"
description = "AI 时代看板：黑箱关键节点暴露窗口 + 可回溯审计资产"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "fastapi>=0.158.2",
    "mcp>=2.3,<3",
    "pydantic>=2.14.1",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
agent-kanban = "cli:main"

[dependency-groups]
# hatchling：AC 用例用 `python -m hatchling build` 离线构建 wheel 断言产物
# （uv build 走隔离环境会拉索引源，CI 不可用）
test = ["httpx2>=2.16,<3", "hatchling>=1.27"]

[tool.uv]
# 默认装 test 组：否则裸 `uv sync` 后跑 AC 会在构建 wheel 处缺 hatchling
default-groups = ["test"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_kanban"]

[tool.hatch.build.targets.wheel.force-include]
"cli.py" = "cli.py"
# 协议树随包分发（入口 + references + templates）：唯一来源＝skills/agent-kanban/（不写第二份副本）
"skills/agent-kanban" = "agent_kanban/data/skill"
