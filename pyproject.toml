[project]
name = "agent-kanban"
version = "0.1.0"
description = "AI 时代看板：黑箱关键节点暴露窗口 + 可回溯审计资产"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "fastapi>=0.158.2",
    "mcp>=2.3,<3",
    "pydantic>=2.14.1",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
agent-kanban = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_kanban"]

[tool.hatch.build.targets.wheel.force-include]
"cli.py" = "cli.py"
